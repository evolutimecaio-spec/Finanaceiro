<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}} · Controle Caio & Mariane</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth"><div class="login"><div class="brand">◈ Controle <b>Caio & Mariane</b></div><h1>{{title}}</h1><p>Um lugar para cuidar das finanças da família.</p>{% for m in get_flashed_messages() %}<div class="notice">{{m}}</div>{% endfor %}<form method="post"><input type="hidden" name="_csrf" value="{{csrf()}}">{% if mode!='login' %}<label>Nome<input name="name" required placeholder="Seu nome"></label>{% endif %}<label>E-mail<input name="email" type="email" required placeholder="voce@email.com"></label><label>Senha<input name="password" type="password" required minlength="10" placeholder="Sua senha"></label>{% if mode=='invite' %}<input type="hidden" name="code" value="{{code}}">{% endif %}<button class="primary">{{'Entrar' if mode=='login' else 'Criar conta'}}</button></form></div></body></html>
